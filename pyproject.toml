[project]
name = "tontoc"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "jlucasbx", email = "jlucasb16@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "ply>=3.11",
]

[project.scripts]
tontoc = "tontoc:main"

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyright>=1.1.411",
    "ruff>=0.16.6",
]
